<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | Grocery Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
          <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-basket2-fill me-2"></i>Grocery Hub</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navLinks">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navLinks">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
              <li class="nav-item"><a class="nav-link" href="menu.html">Menu</a></li>
              <li class="nav-item"><a class="nav-link" href="cart.html">Cart</a></li>
              <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
              <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
            </ul>
            <a class="btn btn-warning position-relative" href="cart.html">
              <i class="bi bi-cart3 me-2"></i>Cart
              <span id="cartBadge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
            </a>
          </div>
        </div>
      </nav>

      <main class="container py-4">
        <div class="card shadow-sm">
          <div class="card-body">
            <h3 class="card-title"><i class="bi bi-envelope-fill me-2 text-primary"></i>Contact us</h3>
            <form class="row g-3">
              <div class="col-md-6">
                <input class="form-control" placeholder="Name" />
              </div>
              <div class="col-md-6">
                <input class="form-control" placeholder="Email" />
              </div>
              <div class="col-12">
                <textarea class="form-control" rows="3" placeholder="Your message"></textarea>
              </div>
              <div class="col-12">
                <button class="btn btn-warning"><i class="bi bi-send-fill me-2"></i>Send</button>
              </div>
            </form>
          </div>
        </div>
      </main>

      <footer class="footer">
        <div class="container">
          <div class="row g-4">
            <div class="col-lg-4">
              <h5 class="fw-bold">Grocery Hub</h5>
              <p class="text-light-emphasis mb-0">Fresh groceries, daily essentials, and doorstep convenience.</p>
            </div>
            <div class="col-lg-4">
              <h6 class="fw-bold">Quick links</h6>
              <ul class="list-unstyled mb-0">
                <li><a href="index.html">Home</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="cart.html">Cart</a></li>
                <li><a href="contact.html">Contact</a></li>
              </ul>
            </div>
            <div class="col-lg-4">
              <h6 class="fw-bold">Follow us</h6>
              <div class="social-links">
                <a href="#" aria-label="Instagram"><i class="bi bi-instagram"></i></a>
                <a href="#" aria-label="Facebook"><i class="bi bi-facebook"></i></a>
                <a href="#" aria-label="X"><i class="bi bi-twitter-x"></i></a>
              </div>
              <p class="mt-3 mb-0 small text-light-emphasis">Call us: +91 98765 43210</p>
            </div>
          </div>
        </div>
      </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
