<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cart | Grocery Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
          <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-basket2-fill me-2"></i>Grocery Hub</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navLinks">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navLinks">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
              <li class="nav-item"><a class="nav-link" href="menu.html">Menu</a></li>
              <li class="nav-item"><a class="nav-link" href="cart.html">Cart</a></li>
              <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
              <li class="nav-item d-none" id="userNavItem"><span class="nav-link text-white" id="userGreeting"></span></li>
              <li class="nav-item d-none" id="logoutNavItem"><button class="nav-link btn btn-link text-white p-0" id="logoutButton" type="button">Logout</button></li>
            </ul>
            <a class="btn btn-outline-light" href="login.html" id="loginNavItem">
              <i class="bi bi-box-arrow-in-right me-2"></i>Login
            </a>
            <a class="btn btn-warning position-relative" href="cart.html">
              <i class="bi bi-cart3 me-2"></i>Cart
              <span id="cartBadge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
            </a>
          </div>
        </div>
      </nav>

      <main class="container py-4">
        <div class="row g-4">
          <div class="col-lg-8">
            <div class="col-lg-8">
            <div class="card shadow-sm">
              <div class="card-body">
                <h3 class="card-title"><i class="bi bi-cart-check-fill me-2 text-success"></i>Your cart</h3>
                <div id="cartItems" class="list-group"></div>
              </div>
            </div>
          </div>
          <div class="col-lg-4">
            <div class="card shadow-sm">
              <div class="card-body">
                <h5 class="card-title"><i class="bi bi-receipt me-2 text-warning"></i>Summary</h5>
                <div class="d-flex justify-content-between"><span>Subtotal</span><span id="subtotal">₹0</span></div>
                <div class="d-flex justify-content-between"><span>Delivery</span><span id="delivery">₹0</span></div>
                <hr />
                <div class="d-flex justify-content-between fw-bold"><span>Total</span><span id="total">₹0</span></div>
                <button id="checkoutBtn" class="btn btn-danger w-100 mt-3"><i class="bi bi-credit-card me-2"></i>Checkout</button>
              </div>
            </div>
          </div>
        </div>
        <div id="checkoutSection" class="card shadow-sm mt-4 d-none">
          <div class="card-body">
            <h5 class="card-title"><i class="bi bi-truck me-2 text-primary"></i>Delivery details</h5>
            <form id="checkoutForm">
              <div class="mb-3">
                <label for="customerName" class="form-label">Full name</label>
                <input id="customerName" class="form-control" type="text" required />
              </div>
              <div class="mb-3">
                <label for="customerEmail" class="form-label">Email</label>
                <input id="customerEmail" class="form-control" type="email" required />
              </div>
              <div class="mb-3">
                <label for="customerPhone" class="form-label">Phone</label>
                <input id="customerPhone" class="form-control" type="tel" placeholder="+91 98765 43210" required />
              </div>
              <div class="mb-3">
                <label for="customerAddress" class="form-label">Delivery address</label>
                <textarea id="customerAddress" class="form-control" rows="3" required></textarea>
              </div>
              <div class="mb-3">
                <label for="paymentMethod" class="form-label">Payment method</label>
                <select id="paymentMethod" class="form-select" required>
                  <option value="cod">Cash on delivery</option>
                  <option value="card">Card payment</option>
                  <option value="upi">UPI</option>
                </select>
              </div>
              <button type="submit" class="btn btn-brown w-100"><i class="bi bi-credit-card-2-front-fill me-2"></i>Place order</button>
            </form>
          </div>
        </div>
      </main>

      <footer class="footer">
        <div class="container">
          <div class="row g-4">
            <div class="col-lg-4">
              <h5 class="fw-bold">Grocery Hub</h5>
              <p class="text-light-emphasis mb-0">Fresh groceries, daily essentials, and doorstep convenience.</p>
            </div>
            <div class="col-lg-4">
              <h6 class="fw-bold">Quick links</h6>
              <ul class="list-unstyled mb-0">
                <li><a href="index.html">Home</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="cart.html">Cart</a></li>
                <li><a href="contact.html">Contact</a></li>
              </ul>
            </div>
            <div class="col-lg-4">
              <h6 class="fw-bold">Follow us</h6>
              <div class="social-links">
                <a href="#" aria-label="Instagram">📸</a>
                <a href="#" aria-label="Facebook">👍</a>
                <a href="#" aria-label="X">✉️</a>
              </div>
              <p class="mt-3 mb-0 small text-light-emphasis">Call us: +91 98765 43210</p>
            </div>
          </div>
        </div>
      </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
