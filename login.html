<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Grocery Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
          <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-basket2-fill me-2"></i>Grocery Hub</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navLinks">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navLinks">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
              <li class="nav-item"><a class="nav-link" href="menu.html">Menu</a></li>
              <li class="nav-item"><a class="nav-link" href="cart.html">Cart</a></li>
              <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
              <li class="nav-item d-none" id="userNavItem"><span class="nav-link text-white" id="userGreeting"></span></li>
              <li class="nav-item d-none" id="logoutNavItem"><button class="nav-link btn btn-link text-white p-0" id="logoutButton" type="button">Logout</button></li>
            </ul>
            <a class="btn btn-warning position-relative" href="cart.html">
              <i class="bi bi-cart3 me-2"></i>Cart
              <span id="cartBadge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
            </a>
          </div>
        </div>
      </nav>

      <main class="container py-5">
        <div class="auth-shell">
          <div class="auth-card card shadow-lg border-0">
            <div class="auth-tabs">
              <button class="auth-tab active" type="button" id="loginTab"><i class="bi bi-box-arrow-in-right me-2"></i>Login</button>
              <button class="auth-tab" type="button" id="signupTab"><i class="bi bi-person-plus-fill me-2"></i>Sign Up</button>
            </div>
            <div class="card-body p-4 p-md-5">
              <div id="authMessage" class="alert alert-info d-none" role="status"></div>

              <form id="loginForm" class="auth-form">
                <h3 class="fw-bold mb-4">Welcome back</h3>
                <div class="mb-3">
                  <label class="form-label" for="loginEmail">Email</label>
                  <input class="form-control" id="loginEmail" type="email" placeholder="you@example.com" required />
                </div>
                <div class="mb-3">
                  <label class="form-label" for="loginPassword">Password</label>
                  <input class="form-control" id="loginPassword" type="password" placeholder="Enter password" required />
                </div>
                <div class="d-flex justify-content-between align-items-center mb-3">
                  <div class="form-check">
                    <input class="form-check-input" id="rememberMe" type="checkbox" />
                    <label class="form-check-label" for="rememberMe">Remember me</label>
                  </div>
                  <a class="small text-decoration-none" href="#">Forgot password?</a>
                </div>
                <button class="btn btn-danger w-100" type="submit"><i class="bi bi-lock-fill me-2"></i>Login</button>
              </form>

              <form id="signupForm" class="auth-form d-none">
                <h3 class="fw-bold mb-4">Create account</h3>
                <div class="mb-3">
                  <label class="form-label" for="signupName">Full name</label>
                  <input class="form-control" id="signupName" type="text" placeholder="Your name" required />
                </div>
                <div class="mb-3">
                  <label class="form-label" for="signupEmail">Email</label>
                  <input class="form-control" id="signupEmail" type="email" placeholder="you@example.com" required />
                </div>
                <div class="mb-3">
                  <label class="form-label" for="signupPassword">Password</label>
                  <input class="form-control" id="signupPassword" type="password" placeholder="Create password" required />
                </div>
                <div class="mb-3">
                  <label class="form-label" for="signupConfirm">Confirm password</label>
                  <input class="form-control" id="signupConfirm" type="password" placeholder="Confirm password" required />
                </div>
                <button class="btn btn-warning w-100" type="submit"><i class="bi bi-person-plus-fill me-2"></i>Create account</button>
              </form>
            </div>
          </div>
        </div>
      </main>

      <footer class="footer">
        <div class="container">
          <div class="row g-4">
            <div class="col-lg-4">
              <h5 class="fw-bold">Grocery Hub</h5>
              <p class="text-light-emphasis mb-0">Fresh groceries, daily essentials, and doorstep convenience.</p>
            </div>
            <div class="col-lg-4">
              <h6 class="fw-bold">Quick links</h6>
              <ul class="list-unstyled mb-0">
                <li><a href="index.html">Home</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="cart.html">Cart</a></li>
                <li><a href="contact.html">Contact</a></li>
              </ul>
            </div>
            <div class="col-lg-4">
              <h6 class="fw-bold">Follow us</h6>
              <div class="social-links">
                <a href="#" aria-label="Instagram"><i class="bi bi-instagram"></i></a>
                <a href="#" aria-label="Facebook"><i class="bi bi-facebook"></i></a>
                <a href="#" aria-label="X"><i class="bi bi-twitter-x"></i></a>
              </div>
            </div>
          </div>
        </div>
      </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const storageKey = 'groceryHubUsers';
      const sessionKey = 'groceryHubSession';
      const loginTab = document.getElementById('loginTab');
      const signupTab = document.getElementById('signupTab');
      const loginForm = document.getElementById('loginForm');
      const signupForm = document.getElementById('signupForm');
      const authMessage = document.getElementById('authMessage');

      function showForm(mode) {
        loginTab.classList.toggle('active', mode === 'login');
        signupTab.classList.toggle('active', mode === 'signup');
        loginForm.classList.toggle('d-none', mode !== 'login');
        signupForm.classList.toggle('d-none', mode !== 'signup');
        authMessage.classList.add('d-none');
      }

      function getUsers() {
        return JSON.parse(localStorage.getItem(storageKey) || '[]');
      }

      function saveUsers(users) {
        localStorage.setItem(storageKey, JSON.stringify(users));
      }

      function saveSession(user) {
        localStorage.setItem(sessionKey, JSON.stringify(user));
      }

      function handleSignupSuccess(name, email, password, message) {
        const users = getUsers();
        const existing = users.find((user) => user.email === email);
        if (!existing) {
          users.push({ name, email, password });
          saveUsers(users);
        }
        authMessage.className = 'alert alert-success';
        authMessage.textContent = message;
        authMessage.classList.remove('d-none');
        signupForm.reset();
        showForm('login');
      }

      function handleLoginSuccess(user, message) {
        saveSession(user);
        authMessage.className = 'alert alert-success';
        authMessage.textContent = message;
        authMessage.classList.remove('d-none');
        loginForm.reset();
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 800);
      }

      loginTab.addEventListener('click', () => showForm('login'));
      signupTab.addEventListener('click', () => showForm('signup'));

      signupForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const name = document.getElementById('signupName').value.trim();
        const email = document.getElementById('signupEmail').value.trim();
        const password = document.getElementById('signupPassword').value;
        const confirm = document.getElementById('signupConfirm').value;

        if (password !== confirm) {
          authMessage.className = 'alert alert-danger';
          authMessage.textContent = 'Passwords do not match.';
          authMessage.classList.remove('d-none');
          return;
        }

        const users = getUsers();
        const existing = users.find((user) => user.email === email);
        if (existing) {
          authMessage.className = 'alert alert-danger';
          authMessage.textContent = 'This email is already registered locally.';
          authMessage.classList.remove('d-none');
          return;
        }

        try {
          const response = await fetch('/api/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, email, password })
          });
          const result = await response.json();
          if (response.ok) {
            handleSignupSuccess(name, email, password, result.message || 'Account created successfully.');
          } else {
            throw new Error(result.message || 'Server registration failed.');
          }
        } catch (error) {
          handleSignupSuccess(name, email, password, 'Account created locally. Login with this email and password.');
        }
      });

      loginForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;

        try {
          const response = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });
          const result = await response.json();
          if (response.ok) {
            const user = result.user || { name: result.name || 'Customer', email };
            handleLoginSuccess(user, result.message || 'Login successful. Redirecting...');
          } else {
            throw new Error(result.message || 'Login failed.');
          }
        } catch (error) {
          const users = getUsers();
          const matched = users.find((user) => user.email === email && user.password === password);
          if (matched) {
            handleLoginSuccess({ name: matched.name, email: matched.email }, 'Offline login successful. Redirecting...');
          } else {
            authMessage.className = 'alert alert-danger';
            authMessage.textContent = 'Unable to reach the server and local login failed.';
            authMessage.classList.remove('d-none');
          }
        }
      });
    </script>
  </body>
</html>
