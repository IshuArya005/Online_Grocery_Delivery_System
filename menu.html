<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop | Grocery Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
          <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-basket2-fill me-2"></i>Grocery Hub</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navLinks">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navLinks">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
              <li class="nav-item"><a class="nav-link" href="menu.html">Menu</a></li>
              <li class="nav-item"><a class="nav-link" href="cart.html">Cart</a></li>
              <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
            </ul>
            <div class="d-flex align-items-center gap-2">
              <a class="btn btn-outline-light" href="login.html">
                <i class="bi bi-box-arrow-in-right me-2"></i>Login
              </a>
              <a class="btn btn-warning position-relative" href="cart.html">
                <i class="bi bi-cart3 me-2"></i>Cart
                <span id="cartBadge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
              </a>
            </div>
          </div>
        </div>
      </nav>

      <main class="container py-4">
        <div class="section-title d-flex justify-content-between align-items-center mb-3">
          <h2 class="fw-bold">Groceries explorer</h2>
          <span class="text-muted">Find essentials fast</span>
        </div>

        <div class="row g-4">
          <div class="col-lg-3">
            <div class="card sidebar-card shadow-sm">
              <div class="card-body">
                <h5 class="fw-bold mb-3"><i class="bi bi-funnel-fill me-2 text-success"></i>Categories</h5>
                <div class="d-grid gap-2">
                  <button class="btn btn-category active" data-category="all"><i class="bi bi-grid-3x3-gap-fill me-2"></i>All items</button>
                  <button class="btn btn-category" data-category="fruits"><i class="bi bi-apple me-2"></i>Fruits</button>
                  <button class="btn btn-category" data-category="vegetables"><i class="bi bi-flower1 me-2"></i>Vegetables</button>
                  <button class="btn btn-category" data-category="dairy"><i class="bi bi-cup-hot me-2"></i>Dairy</button>
                  <button class="btn btn-category" data-category="pantry"><i class="bi bi-box-seam me-2"></i>Pantry</button>
                  <button class="btn btn-category" data-category="household"><i class="bi bi-house-door-fill me-2"></i>Household</button>
                </div>
              </div>
            </div>
          </div>

          <div class="col-lg-9">
            <div class="card p-3 mb-4 shadow-sm">
              <div class="row g-3 align-items-center">
                <div class="col-md-7">
                  <input id="searchInput" class="form-control" type="search" placeholder="🔎 Search item" />
                </div>
                <div class="col-md-5">
                  <select id="priceFilter" class="form-select">
                    <option value="all">All prices</option>
                    <option value="under-200">Under ₹200</option>
                    <option value="200-400">₹200 - ₹400</option>
                    <option value="400+">₹400+</option>
                  </select>
                </div>
              </div>
            </div>
            <div id="menuGrid" class="row g-4"></div>
          </div>
        </div>
      </main>

      <div class="modal fade" id="itemModal" tabindex="-1">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="modalTitle"></h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-footer">
              <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
              <button class="btn btn-danger" id="modalAddBtn">Add to cart</button>
            </div>
          </div>
        </div>
      </div>

      <footer class="footer">
        <div class="container">
          <div class="row g-4">
            <div class="col-lg-4">
              <h5 class="fw-bold">Grocery Hub</h5>
              <p class="text-light-emphasis mb-0">Fresh groceries, daily essentials, and doorstep convenience.</p>
            </div>
            <div class="col-lg-4">
              <h6 class="fw-bold">Quick links</h6>
              <ul class="list-unstyled mb-0">
                <li><a href="index.html">Home</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="cart.html">Cart</a></li>
                <li><a href="contact.html">Contact</a></li>
              </ul>
            </div>
            <div class="col-lg-4">
              <h6 class="fw-bold">Follow us</h6>
              <div class="social-links">
                <a href="#" aria-label="Instagram"><i class="bi bi-instagram"></i></a>
                <a href="#" aria-label="Facebook"><i class="bi bi-facebook"></i></a>
                <a href="#" aria-label="X"><i class="bi bi-twitter-x"></i></a>
              </div>
              <p class="mt-3 mb-0 small text-light-emphasis">Call us: +91 98765 43210</p>
            </div>
          </div>
        </div>
      </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
